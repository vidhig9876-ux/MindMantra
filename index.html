<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in - MindMantra</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><main class="app">
<section class="hero"><span class="logo"></span><div class="label" style="margin-top:10px">MindMantra</div><h1>Welcome back</h1><p class="sub">Log in to your safe space.</p></section>
<div id="msg" class="msg" hidden></div>
<form id="f" class="card" style="display:grid;gap:12px" novalidate>
<label class="field">College email<input id="email" type="email" autocomplete="email" required></label>
<label class="field">Password<span class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" id="eye">Show</button></span></label>
<button class="btn" id="go" type="submit">Log in</button></form>
<p class="center sub">New here? <a href="register.html" style="color:var(--lavD);font-weight:700">Create an account</a></p>
<p class="center sub" style="font-size:.75rem;padding-bottom:20px">MindMantra is a wellness prototype and not a replacement for professional support.</p>
</main>
<script>if(location.protocol==="file:"){document.getElementById("msg").hidden=false;document.getElementById("msg").className="msg err";document.getElementById("msg").textContent="Open this app through a local server (see README), not by double-clicking the file."}</script>
<script src="js/script.js"></script>
<script type="module">
import { configured } from "./js/firebase-config.js";
import { login, friendly, onAuthStateChanged, auth } from "./js/auth.js";
import { isEmail } from "./js/validate.js";
const $ = id => document.getElementById(id), msg = $("msg");
const show = (t, ok) => { msg.hidden = false; msg.className = "msg " + (ok ? "ok" : "err"); msg.textContent = t; };
if (!configured) show("Firebase is not configured yet. Paste your keys into js/firebase-config.js.");
onAuthStateChanged(auth, u => { if (u && configured && !$("go").disabled) go(u); });
async function go(u) { const c = (await u.getIdTokenResult()).claims; location.replace(c.admin ? "admin.html" : "home.html"); }
$("eye").onclick = () => { const p = $("pw"), s = p.type === "password"; p.type = s ? "text" : "password"; $("eye").textContent = s ? "Hide" : "Show"; };
$("f").onsubmit = async e => {
  e.preventDefault(); msg.hidden = true;
  if (!isEmail($("email").value)) return show("Please enter a valid email address.");
  if (!$("pw").value) return show("Please enter your password.");
  $("go").disabled = true; $("go").textContent = "Logging in...";
  try { const r = await login($("email").value, $("pw").value); show("Logged in. Redirecting...", true); location.replace(r.admin ? "admin.html" : "home.html"); }
  catch (err) { show(friendly(err)); $("go").disabled = false; $("go").textContent = "Log in"; }
};
</script></body></html>
